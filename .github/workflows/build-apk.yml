name: Build OVAN Camera APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build OVAN Camera
    runs-on: ubuntu-24.04

    steps:
      # 1. Ambil source code
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Android SDK
      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 5. Accept licenses
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      # 6. Give Gradle permission
      - name: Make Gradle executable
        run: chmod +x gradlew

      # 7. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 8. Check APK
      - name: Check APK
        run: |
          echo "=== APK OUTPUT ==="
          find app/build/outputs -type f -name "*.apk" -print
          echo "=== DEBUG DIRECTORY ==="
          ls -lah app/build/outputs/apk/debug/

      # 9. Upload APK
      - name: Upload OVAN Camera APK
        uses: actions/upload-artifact@v4
        with:
          name: OVAN-Camera-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
